# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title
plugins: [jekyll-sitemap, jekyll-feed, jekyll-seo-tag]
url: https://www.bitdevs-arusha.github.io

sass:
  sass_dir: assets/css
  style: :compressed

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title: "BitDevs Arusha"
description: "BitDevs Arusha is a technical Bitcoin community in Arusha, Tanzania, for those interested in discussing and participating in the research and development of Bitcoin and related protocols."

# include new files
include: 
  - .well-known

# Leave out some files
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', '.sass-cache']

future: true

